name: Release StackChan Custom App Store

on:
  push:
    tags:
      - "store-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. store-v1.2.0)"
        required: true
        default: "store-v1.2.0"
      source_ref:
        description: "Branch/ref to build all modular apps from"
        required: false
        default: "feat/community-suite"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: community-suite
            name: Community Suite
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=ON -DSTACKCHAN_ENABLE_APP_ALARM=ON -DSTACKCHAN_ENABLE_APP_GEMINI=ON -DSTACKCHAN_ENABLE_APP_MCP=ON"
          - id: community-labs
            name: Community Labs Pack (12 Apps)
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=OFF -DSTACKCHAN_ENABLE_APP_ALARM=OFF -DSTACKCHAN_ENABLE_APP_GEMINI=OFF -DSTACKCHAN_ENABLE_APP_MCP=OFF -DSTACKCHAN_ENABLE_APP_FX=ON -DSTACKCHAN_ENABLE_APP_HEALTH=ON -DSTACKCHAN_ENABLE_APP_GAMES=ON -DSTACKCHAN_ENABLE_APP_DECK=ON -DSTACKCHAN_ENABLE_APP_NFC=ON -DSTACKCHAN_ENABLE_APP_HOME=ON -DSTACKCHAN_ENABLE_APP_CALENDAR=ON -DSTACKCHAN_ENABLE_APP_ENGLISH=ON -DSTACKCHAN_ENABLE_APP_TRAKT=ON -DSTACKCHAN_ENABLE_APP_FILES=ON -DSTACKCHAN_ENABLE_APP_COMPANION=ON -DSTACKCHAN_ENABLE_APP_SENTINEL=ON"
          - id: music
            name: Music Player
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=ON -DSTACKCHAN_ENABLE_APP_ALARM=OFF -DSTACKCHAN_ENABLE_APP_GEMINI=OFF -DSTACKCHAN_ENABLE_APP_MCP=OFF"
          - id: alarm
            name: Alarm Clock
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=OFF -DSTACKCHAN_ENABLE_APP_ALARM=ON -DSTACKCHAN_ENABLE_APP_GEMINI=OFF -DSTACKCHAN_ENABLE_APP_MCP=OFF"
          - id: gemini
            name: Gemini Live
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=OFF -DSTACKCHAN_ENABLE_APP_ALARM=OFF -DSTACKCHAN_ENABLE_APP_GEMINI=ON -DSTACKCHAN_ENABLE_APP_MCP=OFF"
          - id: mcp
            name: MCP Bridge
            cmake_flags: "-DSTACKCHAN_ENABLE_APP_MUSIC=OFF -DSTACKCHAN_ENABLE_APP_ALARM=OFF -DSTACKCHAN_ENABLE_APP_GEMINI=OFF -DSTACKCHAN_ENABLE_APP_MCP=ON"

    steps:
      - name: Checkout modular codebase
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'feat/community-suite' }}
          fetch-depth: 0
          submodules: recursive

      - name: Build ESP32-S3 firmware
        shell: bash
        working-directory: firmware
        run: |
          git config --global --add safe.directory "*"
          . /opt/esp/idf/export.sh
          python3 ./fetch_repos.py
          printf "CONFIG_LV_FONT_MONTSERRAT_12=y\nCONFIG_LV_FONT_MONTSERRAT_14=y\n" > sdkconfig.defaults.local
          idf.py set-target esp32s3
          idf.py ${{ matrix.app.cmake_flags }} build
          idf.py merge-bin -o "stackchan-${{ matrix.app.id }}-merged.bin"
          cp build/stack-chan.bin "build/stackchan-${{ matrix.app.id }}-ota.bin"
          ls -lh "build/stackchan-${{ matrix.app.id }}-ota.bin" "build/stackchan-${{ matrix.app.id }}-merged.bin"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-${{ matrix.app.id }}
          path: |
            firmware/build/stackchan-${{ matrix.app.id }}-ota.bin
            firmware/build/stackchan-${{ matrix.app.id }}-merged.bin

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: StackChan Community Apps (${{ github.event.inputs.tag || github.ref_name }})
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.bin
            dist/SHA256SUMS.txt
