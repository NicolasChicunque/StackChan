<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 950" width="820" height="950" role="img" aria-label="StackChan MCP Vertical Voice Flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#131B30"/>
    </linearGradient>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .sub { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .step { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.8px; }
      .h { font: 700 15.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .p { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .m { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .el { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .chip { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.5px; }
      .foot { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="820" height="950" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="948" rx="19" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Header -->
  <text x="410" y="44" text-anchor="middle" class="title">StackChan MCP — Voice Flow</text>
  <text x="410" y="66" text-anchor="middle" class="sub">Top-to-bottom architecture: Antigravity launch → local Whisper → FREE router vs AGENT $ → shared local TTS</text>

  <!-- STEP 0: SESSION START -->
  <g transform="translate(110, 88)">
    <rect width="600" height="94" rx="14" fill="#121E36" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 0 · SESSION START</text>
    <rect x="466" y="10" width="118" height="20" rx="10" fill="#162033" stroke="#334155" stroke-width="1"/>
    <circle cx="480" cy="20" r="3.5" fill="#64748B"/>
    <text x="490" y="24" class="chip" fill="#94A3B8">IDLE → FREE</text>
    <text x="18" y="46" class="h">Open MCP App on StackChan  →  Run /stackchanchat in Antigravity</text>
    <text x="18" y="67" class="p">• StackChan opens in IDLE (mic OFF, zero false triggers) listening on HTTP :80</text>
    <text x="18" y="84" class="p">• /stackchanchat starts stackchan_chat.py → lights up left FREE avatar &amp; arms hands-free mic</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <line x1="410" y1="182" x2="410" y2="214" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="422" y="203" class="el" fill="#2DD4BF">Session active</text>

  <!-- STEP 1: YOU & ROBOT -->
  <g transform="translate(110, 220)">
    <rect width="600" height="86" rx="14" fill="#142038" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 1 · YOU &amp; STACKCHAN (ESP32-S3)</text>

    <!-- Mini dual-avatar indicator -->
    <rect x="444" y="10" width="66" height="20" rx="10" fill="#112624" stroke="#34D399" stroke-width="1"/>
    <circle cx="456" cy="20" r="3" fill="#34D399"/>
    <text x="465" y="24" class="chip" fill="#34D399">FREE</text>
    <rect x="516" y="10" width="68" height="20" rx="10" fill="#261E14" stroke="#FBBF24" stroke-width="1"/>
    <circle cx="527" cy="20" r="3" fill="#FBBF24"/>
    <text x="535" y="24" class="chip" fill="#FBBF24">AGENT $</text>

    <text x="18" y="47" class="h">Speak Hands-Free (AUTO) or Tap TALK</text>
    <text x="18" y="69" class="p">• Records 16 kHz WAV on ESP32-S3 and serves it to the PC via GET /audio</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="410" y1="306" x2="410" y2="338" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="422" y="327" class="el" fill="#60A5FA">WAV audio over Wi-Fi</text>

  <!-- STEP 2: LOCAL WHISPER -->
  <g transform="translate(110, 344)">
    <rect width="600" height="78" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#60A5FA">STEP 2 · LOCAL TRANSCRIPTION (PC)</text>
    <text x="18" y="46" class="h">Faster-Whisper Speech-to-Text</text>
    <text x="18" y="66" class="p">• 100% local in stackchan_chat.py · Locked to OS language (switches on explicit voice request)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="410" y1="422" x2="410" y2="454" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="422" y="443" class="el" fill="#34D399">Transcribed text</text>

  <!-- STEP 3: FREE TIER ROUTER -->
  <g transform="translate(110, 460)">
    <rect width="600" height="96" rx="14" fill="#112624" stroke="#34D399" stroke-width="2.2"/>
    <text x="18" y="23" class="step" fill="#34D399">STEP 3 · SMART ROUTER (FREE TIER)</text>
    <rect x="488" y="10" width="96" height="20" rx="10" fill="#0B1F1C" stroke="#34D399" stroke-width="1"/>
    <text x="536" y="24" text-anchor="middle" class="chip" fill="#34D399">0 IDE QUOTA</text>
    <text x="18" y="47" class="h">Gemini Flash-Lite (Direct Interactions API)</text>
    <text x="18" y="68" class="p">• Answers everyday conversation directly with multi-turn memory</text>
    <text x="18" y="85" class="p">• Decides ESCALATE_TO_ENGINEER when code, Git, build, flash, or live web is needed</text>
  </g>

  <!-- Fork 3 -> 4A (Left) & 4B (Right) -->
  <path d="M 270 556 L 270 598" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="258" y="582" text-anchor="end" class="el" fill="#34D399">Casual chat</text>

  <path d="M 550 556 L 550 598" fill="none" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="562" y="582" text-anchor="start" class="el" fill="#FBBF24">ESCALATE:</text>

  <!-- STEP 4A: CASUAL PATH -->
  <g transform="translate(68, 604)">
    <rect width="324" height="118" rx="14" fill="#102422" stroke="#34D399" stroke-width="2"/>
    <text x="16" y="23" class="step" fill="#34D399">4A · CASUAL PATH (LEFT AVATAR)</text>
    <text x="16" y="47" class="h">Direct Fast Reply</text>
    <text x="16" y="69" class="p">• Left FREE avatar stays lit &amp; animated</text>
    <text x="16" y="88" class="p">• 0 Antigravity / coding agent tokens</text>
    <text x="16" y="107" class="m">Handled fully inside stackchan_chat.py</text>
  </g>

  <!-- STEP 4B: CODING AGENT PATH -->
  <g transform="translate(428, 604)">
    <rect width="324" height="118" rx="14" fill="#261E14" stroke="#FBBF24" stroke-width="2.2"/>
    <text x="16" y="23" class="step" fill="#FBBF24">4B · AGENT PATH (RIGHT AVATAR)</text>
    <text x="16" y="47" class="h">Antigravity / MCP Coding Agent</text>
    <text x="16" y="69" class="p">• Code, Git, Build, Flash, Web search</text>
    <text x="16" y="88" class="p">• Uses agent token quota (AGENT $)</text>
    <text x="16" y="107" class="m">Robot enters WAITING (mic OFF) until reply</text>
  </g>

  <!-- Converge 4A & 4B -> 5 -->
  <path d="M 230 722 L 230 744 L 368 744 L 368 762" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 590 722 L 590 744 L 452 744 L 452 762" fill="none" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="602" y="741" class="m" fill="#FBBF24">+ --context handoff</text>

  <!-- STEP 5: SHARED LOCAL TTS & OUTPUT -->
  <g transform="translate(110, 768)">
    <rect width="600" height="96" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#60A5FA">STEP 5 · SHARED LOCAL VOICE OUTPUT</text>
    <text x="18" y="47" class="h">Piper / Edge TTS  →  POST /play (WAV) to StackChan</text>
    <text x="18" y="68" class="p">• Local TTS in OS language + optional /nod /shake + voice-driven gentle head motion</text>
    <text x="18" y="85" class="p">• Avatar switches FREE ↔ AGENT $ right after playback ends, then resumes silent standby</text>
  </g>

  <!-- Clean Return Loop along Left Margin: Step 5 -> Step 1 -->
  <path d="M 110 816 L 40 816 Q 30 816 30 806 L 30 273 Q 30 263 40 263 L 104 263" fill="none" stroke="#60A5FA" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <text transform="translate(19, 540) rotate(-90)" text-anchor="middle" class="el" fill="#60A5FA">NEXT VOICE TURN · RESUMES SILENT FREE STANDBY</text>

  <!-- Footer -->
  <text x="410" y="898" text-anchor="middle" class="foot">Quick rule: Use GEMINI app for standalone chat without a PC  ·  Use MCP app + /stackchanchat with a coding agent</text>
  <text x="410" y="920" text-anchor="middle" class="m">Say "terminamos" / "end chat" anytime → StackChan returns to IDLE (mic OFF)</text>
</svg>
