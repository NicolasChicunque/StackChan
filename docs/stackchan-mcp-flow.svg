<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1050" width="860" height="1050" role="img" aria-label="StackChan MCP Vertical Voice Flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#131B30"/>
    </linearGradient>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .sub { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .step { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.8px; }
      .h { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .p { font: 400 12.2px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .m { font: 500 11.2px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .el { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .chip { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.5px; }
      .foot { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="1050" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="1048" rx="19" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Header -->
  <text x="430" y="42" text-anchor="middle" class="title">StackChan MCP — Voice Flow (LIVE Primary + Auto-Fallback)</text>
  <text x="430" y="64" text-anchor="middle" class="sub">Screen badges: LIVE 3.8 Primary (Cyan)  →  Auto-Fallback FREE 3.5 LITE (Green)  →  Escalation AGENT $ (Amber)</text>

  <!-- Color Legend Strip -->
  <g transform="translate(132, 78)">
    <rect x="0" y="0" width="196" height="24" rx="12" fill="#0E2235" stroke="#38BDF8" stroke-width="1.6"/>
    <circle cx="14" cy="12" r="4" fill="#38BDF8"/>
    <text x="24" y="16" class="chip" fill="#38BDF8">1. PRIMARY · LIVE 3.8 (Cyan)</text>

    <rect x="208" y="0" width="210" height="24" rx="12" fill="#112624" stroke="#34D399" stroke-width="1.4"/>
    <circle cx="222" cy="12" r="4" fill="#34D399"/>
    <text x="232" y="16" class="chip" fill="#34D399">2. FALLBACK · FREE 3.5 (Green)</text>

    <rect x="430" y="0" width="166" height="24" rx="12" fill="#2A1E10" stroke="#FBBF24" stroke-width="1.4"/>
    <circle cx="444" cy="12" r="4" fill="#FBBF24"/>
    <text x="454" y="16" class="chip" fill="#FBBF24">3. ESCALATE · AGENT $</text>
  </g>

  <!-- STEP 0: SESSION START -->
  <g transform="translate(110, 118)">
    <rect width="640" height="92" rx="14" fill="#121E36" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 0 · SESSION START</text>
    <rect x="478" y="10" width="144" height="20" rx="10" fill="#0E2235" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="492" cy="20" r="3.5" fill="#38BDF8"/>
    <text x="502" y="24" class="chip" fill="#38BDF8">IDLE → LIVE 3.8</text>
    <text x="18" y="46" class="h">Open MCP App on StackChan  →  Run /stackchanchat in Antigravity</text>
    <text x="18" y="66" class="p">• StackChan opens in IDLE (mic OFF) exposing HTTP :80 and color-coded POST /agent_mode</text>
    <text x="18" y="83" class="p">• /stackchanchat launches stackchan_live.py automatically (Cyan LIVE 3.8 badge, 0 IDE quota)</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <line x1="430" y1="210" x2="430" y2="242" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
  <text x="442" y="231" class="el" fill="#38BDF8">Arms hands-free mic + lights up Cyan LIVE 3.8</text>

  <!-- STEP 1: YOU & ROBOT -->
  <g transform="translate(110, 248)">
    <rect width="640" height="84" rx="14" fill="#142038" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 1 · YOU &amp; STACKCHAN (ESP32-S3)</text>
    <text x="18" y="47" class="h">Speak Hands-Free (AUTO) or Tap TALK</text>
    <text x="18" y="68" class="p">• Local ESP32 VAD records 16 kHz mono WAV (level bar in top IP bar) &amp; serves GET /audio</text>
  </g>

  <!-- Primary Arrow 1 -> 2A (LIVE 3.8) -->
  <line x1="252" y1="332" x2="252" y2="378" stroke="#38BDF8" stroke-width="2.6" marker-end="url(#arr-cyan)"/>
  <text x="264" y="360" class="el" fill="#38BDF8">Primary path (default)</text>

  <!-- STEP 2A: PRIMARY ENGINE — LIVE 3.8 (CYAN) -->
  <g transform="translate(64, 384)">
    <rect width="368" height="206" rx="14" fill="#0E2235" stroke="#38BDF8" stroke-width="2.4"/>
    <text x="16" y="23" class="step" fill="#38BDF8">STEP 2 · PRIMARY ENGINE (CYAN BADGE)</text>
    <rect x="266" y="10" width="88" height="20" rx="10" fill="#091826" stroke="#38BDF8" stroke-width="1"/>
    <text x="310" y="24" text-anchor="middle" class="chip" fill="#38BDF8">LIVE 3.8 · FREE</text>
    <text x="16" y="48" class="h">Gemini 3.8 Live (Native Audio Streaming)</text>
    <text x="16" y="70" class="p">1. Bypasses local Whisper &amp; local TTS</text>
    <text x="16" y="90" class="p">2. Streams 100 ms PCM chunks over v1beta WS</text>
    <text x="16" y="108" class="p">   with manual activity_start / activity_end</text>
    <text x="16" y="128" class="p">3. First audio byte starts HTTP/1.1 chunked</text>
    <text x="16" y="146" class="p">   /live/ stream on dedicated port → ESP32 I2S</text>
    <text x="16" y="172" class="m">• Native voice (Puck) · TTFA ~0.8–2.5s · 0 IDE quota</text>
    <text x="16" y="191" class="m">• Escalates via escalate_to_engineer() tool call</text>
  </g>

  <!-- Automatic Fallback Arrow 2A -> 2B (Dashed Green) -->
  <line x1="432" y1="487" x2="478" y2="487" stroke="#34D399" stroke-width="2.4" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
  <text x="455" y="474" text-anchor="middle" class="chip" fill="#34D399">ON ERROR</text>
  <text x="455" y="504" text-anchor="middle" class="chip" fill="#34D399">AUTO</text>

  <!-- STEP 2B: AUTOMATIC FALLBACK — FREE 3.5 LITE (GREEN) -->
  <g transform="translate(484, 384)">
    <rect width="312" height="206" rx="14" fill="#112624" stroke="#34D399" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="16" y="23" class="step" fill="#34D399">AUTO-FALLBACK (GREEN BADGE)</text>
    <rect x="206" y="10" width="92" height="20" rx="10" fill="#0B1F1C" stroke="#34D399" stroke-width="1"/>
    <text x="252" y="24" text-anchor="middle" class="chip" fill="#34D399">FREE 3.5 LITE</text>
    <text x="16" y="48" class="h">stackchan_chat.py (Backup)</text>
    <text x="16" y="70" class="p">• Triggers automatically if Live WS</text>
    <text x="16" y="88" class="p">  fails, disconnects, or hits quota</text>
    <text x="16" y="110" class="p">1. Local Faster-Whisper (OS lang)</text>
    <text x="16" y="128" class="p">2. Gemini 3.5 Flash-Lite Interactions</text>
    <text x="16" y="146" class="p">3. Local Piper / Edge TTS WAV</text>
    <text x="16" y="172" class="m">• Same 0 IDE quota · same behavior</text>
    <text x="16" y="191" class="m">• Escalates via ESCALATE_TO_ENGINEER:</text>
  </g>

  <!-- Escalation Arrows from Both Engines -> Step 3 (Amber) -->
  <path d="M 320 590 L 320 628 L 386 628 L 386 648" fill="none" stroke="#FBBF24" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <path d="M 560 590 L 560 628 L 474 628 L 474 648" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="430" y="620" text-anchor="middle" class="el" fill="#FBBF24">Technical / Code / Git / Flash / Live Web Escalation</text>

  <!-- STEP 3: CODING AGENT PATH (AMBER) -->
  <g transform="translate(110, 654)">
    <rect width="640" height="114" rx="14" fill="#2A1E10" stroke="#FBBF24" stroke-width="2.2"/>
    <text x="18" y="23" class="step" fill="#FBBF24">STEP 3 · CODING AGENT PATH (RIGHT AVATAR · AMBER BADGE)</text>
    <rect x="526" y="10" width="96" height="20" rx="10" fill="#1F150A" stroke="#FBBF24" stroke-width="1"/>
    <text x="574" y="24" text-anchor="middle" class="chip" fill="#FBBF24">AGENT $</text>
    <text x="18" y="47" class="h">Antigravity / MCP Lead Engineer</text>
    <text x="18" y="69" class="p">• Executes repo edits, ESP-IDF builds, USB COM3 flashes, camera/sensor checks &amp; web search</text>
    <text x="18" y="88" class="p">• Robot lights up right AGENT $ avatar (WAITING, mic OFF) while tools run</text>
    <text x="18" y="105" class="m">• Speaks summary via stackchan_say (or --wait-reply), then resumes LIVE 3.8 with --context</text>
  </g>

  <!-- Direct Casual Output Arrows (Cyan Primary & Green Fallback) + Agent Output (Amber) -> Step 4 -->
  <path d="M 150 590 L 150 812 L 260 812 L 260 828" fill="none" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arr-cyan)"/>
  <text x="142" y="714" text-anchor="end" class="m" fill="#38BDF8">Live Stream</text>

  <path d="M 710 590 L 710 812 L 600 812 L 600 828" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="718" y="714" text-anchor="start" class="m" fill="#34D399">Fallback WAV</text>

  <line x1="430" y1="768" x2="430" y2="828" stroke="#FBBF24" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <text x="442" y="800" class="m" fill="#FBBF24">+ --context handoff</text>

  <!-- STEP 4: ROBOT PLAYBACK & LOOP -->
  <g transform="translate(110, 834)">
    <rect width="640" height="94" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#60A5FA">STEP 4 · STACKCHAN PLAYBACK &amp; CONTINUOUS STANDBY</text>
    <text x="18" y="47" class="h">ESP32-S3 I2S Speaker (Live Chunked Stream or Fallback WAV) + Head Motion</text>
    <text x="18" y="68" class="p">• Plays 24 kHz audio immediately with lip-sync &amp; gentle servo motion</text>
    <text x="18" y="85" class="p">• Returns to silent standby (POST /listen/resume) ready for the next hands-free voice turn</text>
  </g>

  <!-- Clean Return Loop along Left Margin: Step 4 -> Step 1 -->
  <path d="M 110 881 L 36 881 Q 26 881 26 871 L 26 300 Q 26 290 36 290 L 104 290" fill="none" stroke="#60A5FA" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <text transform="translate(16, 586) rotate(-90)" text-anchor="middle" class="el" fill="#60A5FA">NEXT VOICE TURN · SILENT STANDBY</text>

  <!-- Footer -->
  <text x="430" y="974" text-anchor="middle" class="foot">Default /stackchanchat = LIVE 3.8 (Cyan)  →  Auto-Fallback = FREE 3.5 LITE (Green)  →  Escalation = AGENT $ (Amber)</text>
  <text x="430" y="996" text-anchor="middle" class="m">Say "terminamos" / "end chat" anytime → StackChan returns to IDLE (mic OFF)</text>
</svg>
