<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1040" width="860" height="1040" role="img" aria-label="StackChan MCP Vertical Voice Flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#131B30"/>
    </linearGradient>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .sub { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .step { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.8px; }
      .h { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .p { font: 400 12.2px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .m { font: 500 11.2px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .el { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .chip { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.5px; }
      .foot { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="1040" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="1038" rx="19" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Header -->
  <text x="430" y="42" text-anchor="middle" class="title">StackChan MCP — Dual-Engine Voice Flow</text>
  <text x="430" y="64" text-anchor="middle" class="sub">Color-coded screen badges: FREE 3.5 LITE (Green)  ·  LIVE 3.8 Streaming (Cyan)  ·  AGENT $ Escalation (Amber)</text>

  <!-- Color Legend Strip -->
  <g transform="translate(150, 78)">
    <rect x="0" y="0" width="174" height="24" rx="12" fill="#112624" stroke="#34D399" stroke-width="1.4"/>
    <circle cx="14" cy="12" r="4" fill="#34D399"/>
    <text x="24" y="16" class="chip" fill="#34D399">FREE 3.5 LITE · Local TTS</text>

    <rect x="190" y="0" width="186" height="24" rx="12" fill="#0E2235" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="204" cy="12" r="4" fill="#38BDF8"/>
    <text x="214" y="16" class="chip" fill="#38BDF8">LIVE 3.8 · Native Audio WS</text>

    <rect x="392" y="0" width="168" height="24" rx="12" fill="#2A1E10" stroke="#FBBF24" stroke-width="1.4"/>
    <circle cx="406" cy="12" r="4" fill="#FBBF24"/>
    <text x="416" y="16" class="chip" fill="#FBBF24">AGENT $ · Coding Agent</text>
  </g>

  <!-- STEP 0: SESSION START -->
  <g transform="translate(110, 118)">
    <rect width="640" height="92" rx="14" fill="#121E36" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 0 · SESSION START</text>
    <rect x="464" y="10" width="158" height="20" rx="10" fill="#162033" stroke="#334155" stroke-width="1"/>
    <circle cx="478" cy="20" r="3.5" fill="#64748B"/>
    <text x="488" y="24" class="chip" fill="#94A3B8">IDLE → FREE / LIVE</text>
    <text x="18" y="46" class="h">Open MCP App on StackChan  →  Run /stackchanchat in Antigravity</text>
    <text x="18" y="66" class="p">• StackChan opens in IDLE (mic OFF) exposing HTTP :80 and dynamic badge via POST /agent_mode</text>
    <text x="18" y="83" class="p">• Choose stackchan_chat.py (Green: FREE 3.5 LITE) or stackchan_live.py (Cyan: LIVE 3.8)</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <line x1="430" y1="210" x2="430" y2="242" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="442" y="231" class="el" fill="#2DD4BF">Arms hands-free mic + lights up left badge</text>

  <!-- STEP 1: YOU & ROBOT -->
  <g transform="translate(110, 248)">
    <rect width="640" height="86" rx="14" fill="#142038" stroke="#2DD4BF" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#2DD4BF">STEP 1 · YOU &amp; STACKCHAN (ESP32-S3)</text>
    <text x="18" y="47" class="h">Speak Hands-Free (AUTO) or Tap TALK</text>
    <text x="18" y="69" class="p">• Local ESP32 VAD records 16 kHz mono WAV (level bar in top IP bar) &amp; serves GET /audio</text>
  </g>

  <!-- Fork 1 -> 2A (Green) & 2B (Cyan) -->
  <path d="M 310 334 L 310 356 L 235 356 L 235 378" fill="none" stroke="#34D399" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <text x="224" y="368" text-anchor="end" class="el" fill="#34D399">stackchan_chat.py</text>

  <path d="M 550 334 L 550 356 L 625 356 L 625 378" fill="none" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arr-cyan)"/>
  <text x="636" y="368" text-anchor="start" class="el" fill="#38BDF8">stackchan_live.py</text>

  <!-- ENGINE A: FREE 3.5 LITE (GREEN) -->
  <g transform="translate(64, 384)">
    <rect width="352" height="204" rx="14" fill="#112624" stroke="#34D399" stroke-width="2.2"/>
    <text x="16" y="23" class="step" fill="#34D399">ENGINE A · FREE 3.5 LITE (GREEN BADGE)</text>
    <rect x="254" y="10" width="84" height="20" rx="10" fill="#0B1F1C" stroke="#34D399" stroke-width="1"/>
    <text x="296" y="24" text-anchor="middle" class="chip" fill="#34D399">0 IDE QUOTA</text>
    <text x="16" y="48" class="h">Faster-Whisper → Flash-Lite → Piper TTS</text>
    <text x="16" y="70" class="p">1. Local Faster-Whisper transcribes WAV (OS lang)</text>
    <text x="16" y="90" class="p">2. Gemini 3.5 Flash-Lite (Interactions API)</text>
    <text x="16" y="108" class="p">   answers casual chat with multi-turn memory</text>
    <text x="16" y="128" class="p">3. Local Piper / Edge TTS generates 24 kHz WAV</text>
    <text x="16" y="148" class="p">   and plays via static HTTP POST /play</text>
    <text x="16" y="172" class="m">• Ultra-consistent local voice · ~1.5–2.5s reply</text>
    <text x="16" y="190" class="m">• Escalates with ESCALATE_TO_ENGINEER:</text>
  </g>

  <!-- ENGINE B: LIVE 3.8 (CYAN) -->
  <g transform="translate(444, 384)">
    <rect width="352" height="204" rx="14" fill="#0E2235" stroke="#38BDF8" stroke-width="2.2"/>
    <text x="16" y="23" class="step" fill="#38BDF8">ENGINE B · LIVE 3.8 (CYAN BADGE)</text>
    <rect x="254" y="10" width="84" height="20" rx="10" fill="#091826" stroke="#38BDF8" stroke-width="1"/>
    <text x="296" y="24" text-anchor="middle" class="chip" fill="#38BDF8">0 IDE QUOTA</text>
    <text x="16" y="48" class="h">Gemini 3.8 Live Native Audio WebSocket</text>
    <text x="16" y="70" class="p">1. Bypasses Whisper &amp; local TTS completely</text>
    <text x="16" y="90" class="p">2. Streams 100 ms PCM chunks over v1beta WS</text>
    <text x="16" y="108" class="p">   with manual activity_start / activity_end</text>
    <text x="16" y="128" class="p">3. First audio byte triggers HTTP/1.1 chunked</text>
    <text x="16" y="148" class="p">   /live/ stream on dedicated port → ESP32 I2S</text>
    <text x="16" y="172" class="m">• Expressive native voice (Puck) · TTFA ~0.8–2.5s</text>
    <text x="16" y="190" class="m">• Escalates via escalate_to_engineer() tool call</text>
  </g>

  <!-- Escalation Arrows from Both Engines -> Step 3 (Amber) -->
  <path d="M 320 588 L 320 626 L 380 626 L 380 644" fill="none" stroke="#FBBF24" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <path d="M 540 588 L 540 626 L 480 626 L 480 644" fill="none" stroke="#FBBF24" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <text x="430" y="618" text-anchor="middle" class="el" fill="#FBBF24">Technical / Code / Git / Flash / Live Web Escalation</text>

  <!-- STEP 3: CODING AGENT PATH (AMBER) -->
  <g transform="translate(110, 650)">
    <rect width="640" height="114" rx="14" fill="#2A1E10" stroke="#FBBF24" stroke-width="2.2"/>
    <text x="18" y="23" class="step" fill="#FBBF24">STEP 3 · CODING AGENT PATH (RIGHT AVATAR · AMBER BADGE)</text>
    <rect x="526" y="10" width="96" height="20" rx="10" fill="#1F150A" stroke="#FBBF24" stroke-width="1"/>
    <text x="574" y="24" text-anchor="middle" class="chip" fill="#FBBF24">AGENT $</text>
    <text x="18" y="47" class="h">Antigravity / MCP Lead Engineer</text>
    <text x="18" y="69" class="p">• Executes repo edits, ESP-IDF builds, USB COM3 flashes, camera/sensor checks &amp; web search</text>
    <text x="18" y="88" class="p">• Robot switches to right AGENT $ avatar (WAITING, mic OFF) while tools execute</text>
    <text x="18" y="105" class="m">• Speaks summary via stackchan_say or asks follow-up via --wait-reply --say, then returns to FREE / LIVE</text>
  </g>

  <!-- Direct Casual Output Arrows (Left Green & Right Cyan) + Agent Output (Amber) -> Step 4 -->
  <path d="M 160 588 L 160 806 L 260 806 L 260 822" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="152" y="710" text-anchor="end" class="m" fill="#34D399">Casual WAV</text>

  <path d="M 700 588 L 700 806 L 600 806 L 600 822" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arr-cyan)"/>
  <text x="708" y="710" text-anchor="start" class="m" fill="#38BDF8">Live Stream</text>

  <line x1="430" y1="764" x2="430" y2="822" stroke="#FBBF24" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <text x="442" y="796" class="m" fill="#FBBF24">+ --context handoff</text>

  <!-- STEP 4: ROBOT PLAYBACK & LOOP -->
  <g transform="translate(110, 828)">
    <rect width="640" height="94" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <text x="18" y="23" class="step" fill="#60A5FA">STEP 4 · STACKCHAN PLAYBACK &amp; CONTINUOUS STANDBY</text>
    <text x="18" y="47" class="h">ESP32-S3 I2S Speaker (Static WAV or Live Chunked Stream) + Head Motion</text>
    <text x="18" y="68" class="p">• Plays 24 kHz audio immediately (resampling to codec rate) with lip-sync &amp; gentle servo motion</text>
    <text x="18" y="85" class="p">• Returns to silent standby (POST /listen/resume) ready for the next hands-free voice turn</text>
  </g>

  <!-- Clean Return Loop along Left Margin: Step 4 -> Step 1 -->
  <path d="M 110 875 L 36 875 Q 26 875 26 865 L 26 300 Q 26 290 36 290 L 104 290" fill="none" stroke="#60A5FA" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <text transform="translate(16, 582) rotate(-90)" text-anchor="middle" class="el" fill="#60A5FA">NEXT VOICE TURN · SILENT STANDBY</text>

  <!-- Footer -->
  <text x="430" y="966" text-anchor="middle" class="foot">Quick rule: GEMINI app = standalone (no PC)  ·  MCP + stackchan_chat.py = FREE 3.5 LITE  ·  MCP + stackchan_live.py = LIVE 3.8</text>
  <text x="430" y="988" text-anchor="middle" class="m">Say "terminamos" / "end chat" anytime → StackChan returns to IDLE (mic OFF)</text>
</svg>
