<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="How StackChan MCP Works">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#131B30"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#14C8B4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .badge { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.6px; }
      .card-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .card-body { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .card-muted { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .edge-label { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .footer { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="438" rx="17" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" class="title">How StackChan MCP Works</text>
  <text x="36" y="64" class="subtitle">Hands-free voice bridge between StackChan (ESP32-S3) and your active Antigravity workspace</text>

  <!-- Card 1: StackChan Robot -->
  <g transform="translate(36, 118)">
    <rect width="225" height="218" rx="14" fill="#142038" stroke="#14C8B4" stroke-width="2"/>
    <rect x="16" y="16" width="66" height="22" rx="11" fill="#0F3D3E"/>
    <text x="49" y="31" text-anchor="middle" class="badge" fill="#2DD4BF">STEP 1</text>

    <!-- Minimal StackChan face icon -->
    <rect x="158" y="14" width="50" height="36" rx="8" fill="#0B1020" stroke="#14C8B4" stroke-width="1.5"/>
    <circle cx="174" cy="28" r="3" fill="#F8FAFC"/>
    <circle cx="192" cy="28" r="3" fill="#F8FAFC"/>
    <rect x="176" y="38" width="14" height="3" rx="1.5" fill="#14C8B4"/>

    <text x="16" y="68" class="card-title">StackChan (MCP App)</text>
    <text x="16" y="92" class="card-body">• Tap TALK or hands-free AUTO</text>
    <text x="16" y="114" class="card-body">• Plays voice + gentle head</text>
    <text x="26" y="131" class="card-body">motion (MOVE ON / OFF)</text>
    <text x="16" y="153" class="card-body">• Shows WAITING (mic off)</text>
    <text x="26" y="170" class="card-body">while the engineer works</text>
    <text x="16" y="198" class="card-muted">ESP32-S3 · Wi-Fi HTTP :80</text>
  </g>

  <!-- Card 2: PC Voice Hub -->
  <g transform="translate(328, 118)">
    <rect width="236" height="218" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <rect x="16" y="16" width="66" height="22" rx="11" fill="#172B4D"/>
    <text x="49" y="31" text-anchor="middle" class="badge" fill="#60A5FA">STEP 2</text>

    <text x="16" y="68" class="card-title">PC Voice Hub</text>
    <text x="16" y="92" class="card-body">• Whisper ASR (local, OS lang)</text>
    <text x="16" y="114" class="card-body">• Piper / Edge TTS (local voice)</text>
    <text x="16" y="136" class="card-body">• Silent standby (0 tokens idle)</text>
    <text x="16" y="162" class="card-body">Routes each turn:</text>
    <text x="24" y="182" class="card-muted">Casual → Flash-Lite · Tech → IDE</text>
    <text x="16" y="202" class="card-muted">stackchan_chat.py</text>
  </g>

  <!-- Card 3A: Casual Chat (Free Tier) -->
  <g transform="translate(652, 92)">
    <rect width="272" height="118" rx="14" fill="#112624" stroke="#34D399" stroke-width="2"/>
    <rect x="16" y="14" width="128" height="22" rx="11" fill="#064E3B"/>
    <text x="80" y="29" text-anchor="middle" class="badge" fill="#34D399">3A · CASUAL CHAT</text>

    <text x="16" y="58" class="card-title">Gemini Flash-Lite (Free)</text>
    <text x="16" y="80" class="card-body">Fast everyday chat &amp; general facts</text>
    <text x="16" y="100" class="card-muted">Direct Gemini API · Uses 0 IDE quota</text>
  </g>

  <!-- Card 3B: Antigravity Engineer -->
  <g transform="translate(652, 232)">
    <rect width="272" height="134" rx="14" fill="#261E14" stroke="#FBBF24" stroke-width="2"/>
    <rect x="16" y="14" width="142" height="22" rx="11" fill="#451A03"/>
    <text x="87" y="29" text-anchor="middle" class="badge" fill="#FBBF24">3B · TECHNICAL / WEB</text>

    <text x="16" y="58" class="card-title">Antigravity Engineer</text>
    <text x="16" y="80" class="card-body">Code, Git, builds, camera &amp; live web</text>
    <text x="16" y="100" class="card-body">Replies aloud or asks follow-ups</text>
    <text x="16" y="120" class="card-muted">Runs in your active IDE workspace</text>
  </g>

  <!-- Arrows: Robot <-> PC -->
  <line x1="261" y1="195" x2="322" y2="195" stroke="#14C8B4" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="292" y="186" text-anchor="middle" class="edge-label" fill="#2DD4BF">Voice</text>

  <line x1="328" y1="262" x2="267" y2="262" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="298" y="281" text-anchor="middle" class="edge-label" fill="#60A5FA">Audio</text>

  <!-- Arrow: PC <-> 3A Casual -->
  <path d="M 564 176 C 602 176, 608 151, 646 151" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="606" y="140" text-anchor="middle" class="edge-label" fill="#34D399">Casual</text>

  <!-- Arrow: PC -> 3B Engineer -->
  <path d="M 564 266 C 602 266, 608 298, 646 298" fill="none" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="606" y="316" text-anchor="middle" class="edge-label" fill="#FBBF24">Escalate</text>

  <!-- Return arrow: Engineer -> Robot (bottom smooth path) -->
  <path d="M 788 366 L 788 384 Q 788 394 778 394 L 158 394 Q 148 394 148 384 L 148 342" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <text x="468" y="387" text-anchor="middle" class="edge-label" fill="#FBBF24">Engineer voice reply / gestures (/nod, /shake, /move) → resumes silent standby</text>

  <!-- Footer -->
  <text x="480" y="424" text-anchor="middle" class="footer">Tip: Use GEMINI app for standalone chat without a PC · Use MCP app + /stackchanchat when working in Antigravity</text>
</svg>
