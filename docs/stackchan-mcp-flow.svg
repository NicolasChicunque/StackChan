<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 516" width="1120" height="516" role="img" aria-label="StackChan MCP Real End-to-End Voice Flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#131B30"/>
    </linearGradient>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .sub { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .step { font: 700 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.7px; }
      .h { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .p { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #CBD5E1; }
      .m { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .el { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .foot { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1120" height="516" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1118" height="514" rx="17" fill="none" stroke="#24314F" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" class="title">StackChan MCP — Real End-to-End Voice Flow</text>
  <text x="32" y="58" class="sub">Session starts in Antigravity (/stackchanchat) → local Whisper → Gemini Flash-Lite (FREE) → optional Coding Agent (AGENT $) → shared TTS</text>

  <!-- 0. START SESSION BANNER -->
  <g transform="translate(28, 74)">
    <rect width="1064" height="34" rx="10" fill="#121C34" stroke="#334155" stroke-width="1.3"/>
    <text x="16" y="21" class="step" fill="#2DD4BF">0 · START SESSION:</text>
    <text x="150" y="21" class="p">Open MCP app on StackChan (</text>
    <text x="319" y="21" class="el" fill="#94A3B8">IDLE</text>
    <text x="348" y="21" class="p">, mic OFF)  →  Run </text>
    <text x="462" y="21" class="el" fill="#FBBF24">/stackchanchat</text>
    <text x="560" y="21" class="p"> in Antigravity  →  Robot switches to </text>
    <text x="774" y="21" class="el" fill="#34D399">FREE</text>
    <text x="808" y="21" class="p"> &amp; arms hands-free mic</text>
  </g>

  <!-- 1. YOU SPEAK (center y=266) -->
  <g transform="translate(28, 217)">
    <rect width="118" height="98" rx="14" fill="#142038" stroke="#2DD4BF" stroke-width="2"/>
    <text x="59" y="24" text-anchor="middle" class="step" fill="#2DD4BF">1 · YOU</text>
    <text x="59" y="48" text-anchor="middle" class="h">Speak</text>
    <text x="59" y="68" text-anchor="middle" class="p">Tap TALK or</text>
    <text x="59" y="84" text-anchor="middle" class="p">hands-free AUTO</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="146" y1="266" x2="184" y2="266" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- 2. STACKCHAN ROBOT (center y=266) -->
  <g transform="translate(190, 201)">
    <rect width="166" height="130" rx="14" fill="#142038" stroke="#2DD4BF" stroke-width="2"/>
    <text x="14" y="23" class="step" fill="#2DD4BF">2 · ROBOT</text>
    <rect x="116" y="10" width="38" height="26" rx="6" fill="#0B1020" stroke="#2DD4BF" stroke-width="1.4"/>
    <circle cx="128" cy="20" r="2.3" fill="#F8FAFC"/>
    <circle cx="142" cy="20" r="2.3" fill="#F8FAFC"/>
    <rect x="129" y="28" width="12" height="2.4" rx="1.2" fill="#2DD4BF"/>

    <text x="14" y="48" class="h">StackChan MCP</text>
    <text x="14" y="69" class="p">• Badge: IDLE/FREE/AGENT $</text>
    <text x="14" y="87" class="p">• Records WAV &amp; plays</text>
    <text x="22" y="102" class="p">voice + head move</text>
    <text x="14" y="120" class="m">ESP32-S3 · HTTP :80</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="356" y1="266" x2="422" y2="266" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="389" y="256" text-anchor="middle" class="el" fill="#60A5FA">WAV</text>
  <text x="389" y="284" text-anchor="middle" class="m">Whisper</text>

  <!-- 3. GEMINI FLASH-LITE ROUTER (center y=266) -->
  <g transform="translate(428, 191)">
    <rect width="196" height="150" rx="14" fill="#112624" stroke="#34D399" stroke-width="2.2"/>
    <text x="14" y="23" class="step" fill="#34D399">3 · FREE TIER ROUTER</text>
    <text x="14" y="48" class="h">Gemini Flash-Lite</text>
    <text x="14" y="69" class="p">• Runs in stackchan_chat.py</text>
    <text x="14" y="88" class="p">• Answers casual chat</text>
    <text x="14" y="107" class="p">• Decides ESCALATE:</text>
    <text x="14" y="132" class="m">Badge: FREE · 0 IDE quota</text>
  </g>

  <!-- Direct Casual path: 3 -> 5 -->
  <line x1="624" y1="231" x2="894" y2="231" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="759" y="220" text-anchor="middle" class="el" fill="#34D399">Casual reply (FREE · 0 quota)</text>

  <!-- Escalation path: 3 -> 4 -->
  <path d="M 526 341 L 526 376 L 652 376" fill="none" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="590" y="366" text-anchor="middle" class="el" fill="#FBBF24">ESCALATE:</text>

  <!-- 4. CODING AGENT (center y=376) -->
  <g transform="translate(658, 322)">
    <rect width="198" height="108" rx="14" fill="#261E14" stroke="#FBBF24" stroke-width="2.2"/>
    <text x="14" y="23" class="step" fill="#FBBF24">4 · CODING AGENT (AGENT $)</text>
    <text x="14" y="46" class="h">Antigravity / MCP</text>
    <text x="14" y="66" class="p">• Code, Git, Build, Web</text>
    <text x="14" y="83" class="p">• Uses agent token quota</text>
    <text x="14" y="99" class="m">Robot in WAITING (mic OFF)</text>
  </g>

  <!-- Agent reply path: 4 -> 5 -->
  <path d="M 856 376 L 878 376 L 878 296 L 894 296" fill="none" stroke="#FBBF24" stroke-width="2.5" marker-end="url(#arr-amber)"/>

  <!-- 5. SHARED LOCAL TTS & OUTPUT (center y=266) -->
  <g transform="translate(900, 201)">
    <rect width="188" height="130" rx="14" fill="#142038" stroke="#60A5FA" stroke-width="2"/>
    <text x="14" y="23" class="step" fill="#60A5FA">5 · VOICE OUTPUT</text>
    <text x="14" y="48" class="h">Piper / Edge TTS</text>
    <text x="14" y="69" class="p">• Text → WAV (local)</text>
    <text x="14" y="87" class="p">• OS language locked</text>
    <text x="14" y="105" class="p">• + MCP gestures / ask</text>
    <text x="14" y="121" class="m">Shared audio engine</text>
  </g>

  <!-- Single clean return arrow: 5 -> 2 -->
  <path d="M 994 331 L 994 458 Q 994 468 984 468 L 283 468 Q 273 468 273 458 L 273 337" fill="none" stroke="#60A5FA" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <text x="633" y="458" text-anchor="middle" class="el" fill="#60A5FA">POST /play (WAV) + optional /nod /shake → StackChan speaks, exits WAITING &amp; resumes FREE standby</text>

  <!-- Footer -->
  <text x="560" y="498" text-anchor="middle" class="foot">Quick rule: Use GEMINI app for standalone chat without a PC  ·  Use MCP app + /stackchanchat when working with a coding agent</text>
</svg>
